name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2']

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Resolve package dependencies
        run: composer update --no-dev --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test

      - name: Check PHP syntax
        run: find src config tests -path tests/pest/vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

  pest:
    name: Pest on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Resolve package dependencies
        run: composer update --no-dev --prefer-dist --no-interaction --no-progress

      - name: Install locked Pest test dependencies
        run: composer --working-dir=tests/pest install --prefer-dist --no-interaction --no-progress

      - name: Run compatibility tests
        run: composer test

      - name: Run Pest unit tests
        run: composer test:unit

      - name: Check PHP syntax
        run: find src config tests -path tests/pest/vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
