name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Xdebug coverage
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: xdebug
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Resolve package dependencies
        run: composer update --no-dev --prefer-dist --no-interaction --no-progress

      - name: Install locked Pest test dependencies
        run: composer --working-dir=tests/pest install --prefer-dist --no-interaction --no-progress

      - name: Generate compatibility coverage report
        run: XDEBUG_MODE=coverage php tests/coverage.php

      - name: Generate Pest unit coverage report
        run: XDEBUG_MODE=coverage composer test:unit -- --coverage-clover=coverage-pest.xml

      - name: Store coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-clover
          path: |
            coverage.xml
            coverage-pest.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml,coverage-pest.xml
          flags: unittests
          name: bybit-php
          fail_ci_if_error: true
          verbose: true
